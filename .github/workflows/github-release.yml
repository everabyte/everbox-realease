# Creates the PUBLIC GitHub release for a version tag (<version>+<build>,
# NO "v" prefix — owner convention 2026-10-08).
#
# Trigger: push a tag naming the release —
#   git tag 1.1.2+13 && git push origin 1.1.2+13
# The packages are read from the repository's main branch under either
# supported layout (arch-ful or arch-less, folder named <version> or the
# full tag), plus the root CHANGELOG.json (release notes feed). Any tag
# that is not a valid <version>+<build> matching CHANGELOG.json is refused
# by the staging script (visible failure, nothing published).
#
# Every platform found for the version joins the SAME release — Windows,
# macOS (arm64/x64) and every Linux format (.deb, .rpm, AppImage) are
# picked up automatically whenever their package files exist.
#
# Assets are attached with STABLE, version-independent names so the
# permanent links below always serve the newest build — these are the URLs
# used on everabyte.com:
#   https://github.com/everabyte/everbox-realease/releases/latest
#   https://github.com/everabyte/everbox-realease/releases/latest/download/EverBox-Setup-x64.exe
#   https://github.com/everabyte/everbox-realease/releases/latest/download/SHA256SUMS.txt
#
# Re-running for the same tag (a late macOS/Linux build) uploads the
# missing assets into the EXISTING release — one release always carries
# every platform. The release is marked latest.

name: github-release

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)publish (<version>+<build>, e.g. 1.1.2+13)'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (the branch that carries the packages)
        uses: actions/checkout@v4
        with:
          # The versioned packages and CHANGELOG.json live on main; the tag
          # only NAMES the release. Checking out main is also what lets a
          # platform committed after the tag (late Linux/macOS build) join
          # the existing release on a re-run — the tag's frozen tree would
          # keep missing it.
          ref: main

      - name: Stage assets (stable names, SHA256SUMS, release notes)
        run: bash scripts/build-release-assets.sh "$RELEASE_TAG"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/create-release.sh "$RELEASE_TAG" --repo "${{ github.repository }}"
